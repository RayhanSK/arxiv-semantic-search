services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: raguser
      POSTGRES_PASSWORD: ragpass
      POSTGRES_DB: arxiv_rag
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raguser -d arxiv_rag"]
      interval: 5s
      retries: 10

  api:
    build:
      context: .
      args: { ML: "true" }
    environment:
      DATABASE_URL: postgresql+psycopg2://raguser:ragpass@db:5432/arxiv_rag
      EMBEDDING_BACKEND: sentence-transformers
      LLM_BACKEND: auto                # auto-detects an Ollama/vLLM endpoint, else extractive
      # LLM_API_BASE: http://host.docker.internal:11434/v1   # host Ollama
      # LLM_API_MODEL: llama3.1:8b
    volumes: ["appdata:/app/data"]
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      API_BASE: http://api:8000/api/v1
    ports: ["8501:8501"]
    depends_on: [api]

volumes:
  pgdata:
  appdata:
